<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nugrohos Music</title>
    <link rel="icon" href="assets/logo.png">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .gate {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 20px;
            gap: 18px;
        }

        .gate img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .gate h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .gate .status {
            font-size: 0.85rem;
            color: var(--text-color);
            opacity: 0.65;
            min-height: 1.2em;
        }

        .gate a.enter {
            display: none;
            margin-top: 8px;
            padding: 12px 28px;
            border-radius: 6px;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .gate a.enter:hover {
            background: var(--text-color);
            color: #000000;
        }

        .gate a.enter.is-ready {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="gate">
        <img src="assets/logo.png" alt="Yulian Nugrohos Group">
        <h1>Halaman ini dilindungi anti-clone.js</h1>
        <p class="status" id="gate-status">Memverifikasi halaman...</p>
        <a href="nugrohos_music/index.html" class="enter" id="gate-enter">Masuk ke Nugrohos Music</a>
    </div>
    <script src="anti-clone.js"></script>
</body>
</html>
